[gcode_macro CHAMBER_PLA]
description: PLA chamber - prevents both warping and heat creep
gcode:
    SET_TEMPERATURE_FAN_TARGET temperature_fan=exhaust_fan target=35
    M117 Chamber: PLA (35C)

[gcode_macro CHAMBER_PLA_LARGE]
description: Large PLA parts - more warping prevention
gcode:
    SET_TEMPERATURE_FAN_TARGET temperature_fan=exhaust_fan target=38
    M117 Chamber: PLA Large (38C, monitor for heat creep)

[gcode_macro CHAMBER_PETG]
description: PETG chamber - higher Tg allows warmer chamber
gcode:
    SET_TEMPERATURE_FAN_TARGET temperature_fan=exhaust_fan target=45
    M117 Chamber: PETG (45C)

[gcode_macro CHAMBER_ABS]
description: ABS chamber - needs heat, no heat creep issues
gcode:
    SET_TEMPERATURE_FAN_TARGET temperature_fan=exhaust_fan target=58
    M117 Chamber: ABS (58C)

[gcode_macro CHAMBER_OFF]
description: Disable chamber temperature control
gcode:
    SET_TEMPERATURE_FAN_TARGET temperature_fan=exhaust_fan target=0
    M117 Chamber control disabled