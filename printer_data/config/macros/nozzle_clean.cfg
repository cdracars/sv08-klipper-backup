#--------------------------------------------------------------------#
# NOZZLE CLEAN
# AFC-style gantry-mounted brush
#--------------------------------------------------------------------#

[gcode_macro WIPER_RUN]
description: Clean nozzle on AFC gantry brush
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        {action_raise_error("WIPER_RUN requires homed XYZ")}
    {% endif %}
    G90
    # AFC stock brush geometry: center X65 Y364, 30x10 mm, Z7 engagement
    G1 X65 Y364 F9000
    G1 Z7 F1800
    # Four Y sweeps, then four X sweeps, matching AFC BRUSH behavior
    {% for wipe in range(4) %}
        G1 Y359 F4500
        G1 Y369 F4500
        G1 Y364 F4500
    {% endfor %}
    {% for wipe in range(4) %}
        G1 X50 F4500
        G1 X80 F4500
        G1 X65 F4500
    {% endfor %}
    M400
    M117 AFC BRUSH CLEAN
