[mcu expander]
serial: /dev/serial/by-id/usb-Klipper_stm32f042x6_0D003A001653304B4D323431-if00 # Serial connection for the MCU expander
restart_method: command                                               # Restart method for the expander

# [temperature_fan exhaust_fan]
# pin: expander:PA0
# sensor_type: Generic 3950
# sensor_pin: expander:PA6
# control: pid
# target_temp: 45.0
# min_temp: 0
# max_temp: 100
# max_speed: 1.0
# min_speed: 0.4
# pid_Kp: 40.0
# pid_Ki: 0.2
# pid_Kd: 0.1
# kick_start_time: 5.0
# off_below: 0.3
# gcode_id: C

[temperature_fan exhaust_fan]
pin: expander:PA0
sensor_type: Generic 3950
sensor_pin: expander:PA6
control: watermark          # Much simpler than PID
max_delta: 3.0             # Turn on when 3°C over target, off when 3°C under
target_temp: 45.0          # Default target
min_temp: 0
max_temp: 80               # High safety limit
max_speed: 1.0
min_speed: 0.0
kick_start_time: 5.0
off_below: 0.1
gcode_id: C

[controller_fan SSR]
## Controller fan - FAN2 Connector
pin: expander:PA1                            # Signal interface pin for controller fan
fan_speed: .5
heater: heater_bed
# cycle time: 0.50                   # Cycle time for the fan (commented out)

[temperature_fan Mainboard_fan]
pin: expander:PA2
sensor_type: temperature_host
control: pid
min_temp: 0
max_temp: 90
target_temp: 60
pid_Kp: 2.0
pid_Ki: 5.0
pid_Kd: 0.5

# [output_pin mosfet3]                 # Output pin for MOSFET 3
# pin: expander:PA3                      # Signal interface pin for MOSFET 3
# pwm: true                               # Enable PWM control
# cycle_time: 0.010                      # Cycle time for PWM signal
# value: 0                                # Initial value for the output
# shutdown_value: 0                       # Value when shutting down

# # Status LED lights when Klipper connects
# [static_digital_output onboardLED]
# pins: !expander:PA4                   # Pin for the onboard LED

# [neopixel expanderPixel]              # Neopixel configuration
# pin: expander:PB1                      # Signal interface pin for Neopixel
# chain_count: 1                         # Number of Neopixels in the chain
# initial_RED: 0.9                       # Initial red value for Neopixel
# initial_GREEN: 0.3                     # Initial green value for Neopixel
# initial_BLUE: 0.0                      # Initial blue value for Neopixel

[temperature_sensor Chamber]          # Display-only sensor
sensor_type: temperature_combined     # Special type for referencing another sensor
sensor_list: temperature_fan exhaust_fan
combination_method: mean              # Just displays the same value
maximum_deviation: 999                # Allow any deviation (since it's the same sensor)

# Other Pins
# T0 = PA6                              # Temperature sensor T0 pin
# T1 = PA5                              # Temperature sensor T1 pin
# GPIO = PA7                            # General purpose input/output pin